name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify changelog
        run: npm run test:changelog
      - name: Ensure dist is committed and fresh
        run: |
          test -f dist/carlinko-card.js
          git update-index --refresh || true
          # Check the shipped JS only — source maps can differ across OS/Node builds.
          if ! git diff --quiet -- dist/carlinko-card.js; then
            echo "dist/ is out of date — run npm run build and commit dist/"
            git diff -- dist/carlinko-card.js || true
            exit 1
          fi

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin

  release:
    name: Tag and GitHub release
    needs: [quality, hacs]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: ver
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('./package.json','utf8')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract release notes from CHANGELOG
        run: |
          node scripts/extract-changelog-section.mjs "${{ steps.ver.outputs.version }}" \
            > release-notes.md

      - name: Create tag if missing
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git fetch --tags origin
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
            exit 0
          fi
          gh release create "$TAG" \
            --title "CarLinko Cards ${{ steps.ver.outputs.tag }}" \
            --notes-file release-notes.md
